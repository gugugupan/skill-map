<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%235E6873' stroke-width='2'%3E%3Cline x1='16' y1='16' x2='6' y2='7'/%3E%3Cline x1='16' y1='16' x2='26' y2='9'/%3E%3Cline x1='16' y1='16' x2='15' y2='27'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='6' fill='%2318202B'/%3E%3Ccircle cx='6' cy='7' r='4' fill='%233D5A99'/%3E%3Ccircle cx='26' cy='9' r='4' fill='%232A8C82'/%3E%3Ccircle cx='15' cy='27' r='4' fill='%23B23A48'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skill Map · 知识图谱</title>
    <script>
      // Mirrors initialLang() in src/i18n.ts so the tab title and <html lang> are right before the bundle loads.
      ;(function () {
        var lang = new URLSearchParams(location.search).get('lang')
        if (lang !== 'zh' && lang !== 'en') {
          try { lang = localStorage.getItem('skill-map-lang') } catch (e) { lang = null }
        }
        if (lang !== 'zh' && lang !== 'en') {
          lang = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'
        }
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
        document.title = lang === 'zh' ? '知识图谱' : 'Skill Map'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
