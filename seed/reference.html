<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Infra 知识图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --ink:#18202B; --muted:#5E6873; --line:#C9D0D6; --edge:#AEB7BF;
  --focus:#2F6FB3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171D; --surface:#1A2129; --ink:#E4E8EC; --muted:#93A0AC; --line:#2C3640; --edge:#3A4652;
    --focus:#7FB2E8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1A2129; --ink:#E4E8EC; --muted:#93A0AC; --line:#2C3640; --edge:#3A4652;
  --focus:#7FB2E8; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{width:140px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main{display:grid;grid-template-columns:1fr 400px;min-height:0}
#graph{position:relative;min-height:0;overflow:hidden}
#graph svg{width:100%;height:100%;display:block;cursor:grab}
.legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);max-width:70%;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:50%;display:inline-block}
.hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted)}
aside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:22px 24px 40px}
aside h2{font-size:20px;line-height:1.3;margin:4px 0 6px}
aside h3{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 6px}
aside p{margin:0 0 8px;max-width:62ch}
aside ul{margin:0;padding-left:18px}
aside li{margin:3px 0}
.cl{font-size:13px;font-weight:600}
.jd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.jd span{font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.jd span.on{color:var(--ink);border-color:var(--ink)}
.status{display:flex;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.status button{font:inherit;font-size:13px;padding:6px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.status button+button{border-left:1px solid var(--line)}
.status button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.links a{color:var(--focus);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.path li{margin:8px 0}
.path a{color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.path a.done{color:var(--muted);text-decoration:line-through}
.back{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}
.node text{font-size:12px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.node.hub text{font-size:13px;font-weight:700}
.node.root text{font-size:15px;font-weight:700}
.node{cursor:pointer}
.node.dim{opacity:.15}
.link{stroke:var(--edge);stroke-width:1}
.link.pre{stroke-dasharray:3 3}
.link.dim{opacity:.1}
.link.hl{stroke:var(--ink);stroke-width:1.6;opacity:1}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .app{height:auto}
  .filters{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<header>

let filter = null, selected = null;

[['全部',null],...Object.entries(JD).map(([k,v])=>[v,k])].forEach(([label,key])=>{

  b.className='chip'; b.textContent=label; b.setAttribute('aria-pressed', key===filter);

document.getElementById('legend').innerHTML = Object.values(CLUSTERS).map(c=>`<span><b style="background:${c.color}"></b>${c.name}</span>`).join('');

// graph data
const nodes = [{id:'root',type:'root',label:'Agent Infra 工程师'}];
const links = [];
Object.entries(CLUSTERS).forEach(([k,c])=>{ nodes.push({id:'h_'+k,type:'hub',c:k,label:c.name}); links.push({source:'root',target:'h_'+k,kind:'tree'}); });
N.forEach(n=>{ n.jd = n.jd.split(' '); });
N.forEach(n=>{ nodes.push({id:n.id,type:'leaf',c:n.c,label:n.n}); links.push({source:'h_'+n.c,target:n.id,kind:'tree'}); });
PRE.forEach(([a,b])=>links.push({source:a,target:b,kind:'pre'}));

const svg = d3.select('#svg');
const g = svg.append('g');
svg.call(d3.zoom().scaleExtent([.3,3]).on('zoom',e=>g.attr('transform',e.transform)));

const ckeys = Object.keys(CLUSTERS);
function anchor(c){ const i=ckeys.indexOf(c); const a=i/ckeys.length*2*Math.PI - Math.PI/2; return [Math.cos(a)*380, Math.sin(a)*300]; }

const linkSel = g.append('g').selectAll('line').data(links).join('line').attr('class',d=>'link'+(d.kind==='pre'?' pre':''));
const nodeSel = g.append('g').selectAll('g').data(nodes).join('g')
  .attr('class',d=>'node '+d.type).attr('tabindex',d=>d.type==='leaf'?0:null)
  .attr('role',d=>d.type==='leaf'?'button':null).attr('aria-label',d=>d.label)
  .on('click',(e,d)=>{ if(d.type==='leaf') select(d.id); else if(d.type==='root') select(null); })
  .on('keydown',(e,d)=>{ if((e.key==='Enter'||e.key===' ')&&d.type==='leaf'){ e.preventDefault(); select(d.id);} })
  .call(d3.drag().on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; }).on('end',(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

const R = d=> d.type==='root'?22 : d.type==='hub'?13 : 5 + (byId[d.id].jd.length)*1.25;
const col = d=> d.type==='root'? 'var(--ink)' : CLUSTERS[d.c].color;

nodeSel.append('circle').attr('class','ring').attr('r',d=>R(d)+3.5).attr('fill','none').attr('stroke-width',2);
nodeSel.append('circle').attr('class','dot').attr('r',R).attr('stroke','var(--bg)').attr('stroke-width',1.5);
nodeSel.append('text').attr('dy',d=>R(d)+14).attr('text-anchor','middle').text(d=>d.label);

function paint(){
  nodeSel.select('.dot').attr('fill',d=>{
    if(d.type!=='leaf') return col(d);
    const s = prog[d.id]||0; return s===0? 'var(--surface)' : col(d);
  }).attr('stroke',d=> d.type==='leaf' ? col(d) : 'var(--bg)').attr('stroke-width',d=>d.type==='leaf'?2:1.5)
    .attr('fill-opacity',d=> d.type==='leaf' && (prog[d.id]||0)===1 ? .45 : 1);
  nodeSel.select('.ring').attr('stroke',d=> d.id===selected ? 'var(--ink)' : 'transparent');
  const total=N.length, done=N.filter(n=>prog[n.id]===2).length, doing=N.filter(n=>prog[n.id]===1).length;
  document.getElementById('barFill').style.width = (done/total*100)+'%';
  document.getElementById('progText').textContent = `已掌握 ${done} / ${total}，学习中 ${doing}`;
}

function applyDim(){
  const rel = new Set();
  if(selected){ rel.add(selected); links.forEach(l=>{ if(l.kind==='pre'){ if(l.source.id===selected) rel.add(l.target.id); if(l.target.id===selected) rel.add(l.source.id);} }); }
  nodeSel.classed('dim',d=>{
    if(d.type!=='leaf') return false;
    if(filter && !byId[d.id].jd.includes(filter)) return true;
    return false;
  });
  linkSel.classed('hl',l=> selected && l.kind==='pre' && (l.source.id===selected||l.target.id===selected))
    .classed('dim',l=> filter && ((l.source.type==='leaf'&&!byId[l.source.id].jd.includes(filter))||(l.target.type==='leaf'&&!byId[l.target.id].jd.includes(filter))));
}

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id).distance(l=> l.kind==='pre'?120 : l.source.id==='root'?200:60).strength(l=>l.kind==='pre'?.05:.6))
  .force('charge', d3.forceManyBody().strength(d=>d.type==='root'?-600:d.type==='hub'?-300:-140))
  .force('x', d3.forceX(d=> d.type==='root'?0 : anchor(d.c)[0]).strength(d=>d.type==='root'?.5:.12))
  .force('y', d3.forceY(d=> d.type==='root'?0 : anchor(d.c)[1]).strength(d=>d.type==='root'?.5:.12))
  .force('collide', d3.forceCollide(d=>R(d)+20))
  .on('tick',()=>{
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
  });

function fit(){
  const el=document.getElementById('graph'); const w=el.clientWidth, h=el.clientHeight;
  const s=Math.min(w/1000,h/860,1.1);
  svg.call(d3.zoom().scaleExtent([.3,3]).on('zoom',e=>g.attr('transform',e.transform)).transform, d3.zoomIdentity.translate(w/2,h/2).scale(s));
}
fit(); window.addEventListener('resize',fit);

const panel = document.getElementById('panel');
function linkTo(id){ return `<a data-id="${id}">${byId[id].n}</a>`; }
function select(id){
  selected=id; paint(); applyDim();
  if(!id){ renderHome(); return; }
  const n=byId[id], c=CLUSTERS[n.c];
  const pre = PRE.filter(p=>p[1]===id).map(p=>p[0]), next = PRE.filter(p=>p[0]===id).map(p=>p[1]);
  const s = prog[id]||0;
  panel.innerHTML = `
    <button class="back" id="back">返回学习路线</button>
    <div class="cl" style="color:${c.color};margin-top:14px">${c.name}</div>
    <h2>${n.n}</h2>
    <p>${n.d}</p>
    <div class="jd">${Object.entries(JD).map(([k,v])=>`<span class="${n.jd.includes(k)?'on':''}">${v}</span>`).join('')}</div>
    <div class="status" role="group" aria-label="学习状态">${STATUS.map((t,i)=>`<button data-s="${i}" aria-pressed="${i===s}">${t}</button>`).join('')}</div>
    <h3>核心概念</h3><ul>${n.k.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h3>动手练习</h3><p>${n.p}</p>
    <h3>学习资料</h3><ul>${n.r.map(x=>`<li>${x}</li>`).join('')}</ul>
    ${pre.length?`<h3>先修</h3><p class="links">${pre.map(linkTo).join('、')}</p>`:''}
    ${next.length?`<h3>学完可以进入</h3><p class="links">${next.map(linkTo).join('、')}</p>`:''}`;
  panel.querySelector('#back').onclick=()=>select(null);
  panel.querySelectorAll('.status button').forEach(b=>b.onclick=()=>{ prog[id]=+b.dataset.s; saveProg(); select(id); });
  bindLinks(); panel.scrollTop=0;
}
function bindLinks(){ panel.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>select(a.dataset.id)); }

    <p>节点越大，被越多公司提到。空心是未开始，半透明是学习中，实心是已掌握。虚线表示先修关系。</p>
    <h3>被最多公司提到</h3>
    <ol>${top.map(n=>`<li>${linkTo(n.id)}（${n.jd.length} 家）</li>`).join('')}</ol>
    <h3>建议顺序</h3>
    <ol class="path">${PATH.map(p=>`<li><strong>${p.t}</strong><br>${p.ids.map(id=>`<a data-id="${id}" class="${prog[id]===2?'done':''}">${byId[id].n}</a>`).join('、')}</li>`).join('')}</ol>
    <h3>扩展 JD 带来的新信号</h3>
    <ul>
      <li>沙箱向更底层走：KVM、eBPF、VM 编排成为硬要求。</li>
      <li>模型接入与路由成了独立职责：新模型上线、自动选模型、LLM Gateway。</li>
      <li>异步与混合部署：Agent 在后台跑数小时，并能跑在客户自有环境。</li>
      <li>日本市场偏应用平台：Gateway、Guardrails、评测、成本管理。</li>
    </ul>
    <h3>JD 来源</h3>
    ${SOURCES.map(s=>`<p style="margin-bottom:4px"><strong>${JD[s.k]}</strong>（覆盖 ${counts[s.k]} 个节点）</p><ul style="margin-bottom:10px">${s.jobs.map(([t,u])=>`<li>${u?`<a href="${u}" target="_blank" rel="noopener" style="color:var(--focus)">${t}</a>`:t}</li>`).join('')}</ul>`).join('')}`;
  bindLinks();
}
paint(); applyDim(); renderHome();
</script>
